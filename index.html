<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Constancia Domiciliaria | Iniciar sesión</title>

    <style>
    body {
        background: red !important;
    }

    .login-card {
        background: yellow !important;
    }
</style>
<link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <!-- Logo -->
            <div class="logo">

                <div class="logo-icon">
                    🏠
                </div>

                <h1>
                    Constancia
                    <span>Domiciliaria</span>
                </h1>

            </div>


            <!-- Bienvenida -->
            <p class="welcome">
                Bienvenido/a
            </p>

            <p class="subtitle">
                Ingresa tus datos para acceder al módulo de solicitud.
            </p>


            <!-- Formulario -->
            <form id="loginForm">

                <div class="input-group">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresa tu usuario"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                </div>


                <!-- Opciones -->
                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="recordarme"
                        >

                        Recordarme

                    </label>


                    <a href="#" id="recuperar">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>


                <!-- Botón -->
                <button type="submit">
                    Iniciar sesión
                </button>

            </form>


            <!-- Registro -->
            <div class="divider">
                <span>o</span>
            </div>

            <p class="register">

                ¿No tienes una cuenta?

                <a href="#" id="crearCuenta">
                    Crear cuenta
                </a>

            </p>

        </section>


        <!-- Pie de página -->
        <footer>
            © 2026 Melany Sarahi Hernández Bajonero
        </footer>

        </main>

    <script src="js/script.js"></script>

</body>

</html>
