<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Constancia Domiciliaria | Iniciar sesión</title>

   
    <style>
        /* ========================================
   CONFIGURACIÓN GENERAL
======================================== */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    font-family: "Segoe UI", Arial, sans-serif;

    min-height: 100vh;

    display: flex;
    justify-content: center;
    align-items: center;

    background: linear-gradient(
        135deg,
        #ffd6e7,
        #f7a9c8,
        #ef8fb5
    );

    color: #4a2635;
}


/* ========================================
   CONTENEDOR DEL LOGIN
======================================== */

.login-container {
    width: 100%;
    max-width: 480px;

    padding: 25px;
}


/* ========================================
   TARJETA
======================================== */

.login-card {
    width: 100%;

    padding: 40px;

    background-color: white;

    border-radius: 25px;

    box-shadow:
        0 15px 40px rgba(128, 35, 75, 0.20);
}


/* ========================================
   LOGO
======================================== */

.logo {
    text-align: center;

    margin-bottom: 30px;
}

.logo-icon {
    width: 75px;
    height: 75px;

    margin: 0 auto 15px;

    display: flex;
    justify-content: center;
    align-items: center;

    border-radius: 50%;

    background: linear-gradient(
        135deg,
        #d63384,
        #ee72a8
    );

    color: white;

    font-size: 35px;

    box-shadow:
        0 8px 20px rgba(214, 51, 132, 0.30);
}

.logo h1 {
    color: #a52560;

    font-size: 24px;

    line-height: 1.3;
}

.logo h1 span {
    color: #d63384;
}


/* ========================================
   TEXTOS
======================================== */

.welcome {
    text-align: center;

    font-size: 27px;

    font-weight: bold;

    color: #492331;

    margin-bottom: 10px;
}

.subtitle {
    text-align: center;

    color: #8a6876;

    font-size: 14px;

    line-height: 1.6;

    margin-bottom: 30px;
}


/* ========================================
   CAMPOS
======================================== */

.input-group {
    margin-bottom: 20px;
}

.input-group label {
    display: block;

    margin-bottom: 8px;

    color: #5c3043;

    font-size: 14px;

    font-weight: bold;
}

.input-group input {
    width: 100%;

    padding: 14px 15px;

    border: 1px solid #e5c6d3;

    border-radius: 10px;

    outline: none;

    font-size: 14px;

    color: #4a2635;

    background-color: white;

    transition: 0.3s;
}

.input-group input::placeholder {
    color: #b99daa;
}

.input-group input:focus {
    border-color: #d63384;

    box-shadow:
        0 0 0 3px rgba(214, 51, 132, 0.12);
}


/* ========================================
   OPCIONES
======================================== */

.options {
    display: flex;

    justify-content: space-between;

    align-items: center;

    margin: 5px 0 25px;

    font-size: 13px;
}

.remember {
    display: flex;

    align-items: center;

    gap: 7px;

    color: #765363;
}

.remember input {
    accent-color: #d63384;

    cursor: pointer;
}

.options a {
    color: #c72d75;

    text-decoration: none;

    font-weight: bold;
}

.options a:hover {
    text-decoration: underline;
}


/* ========================================
   BOTÓN
======================================== */

button {
    width: 100%;

    padding: 15px;

    border: none;

    border-radius: 10px;

    background: linear-gradient(
        135deg,
        #d63384,
        #e95d98
    );

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

    box-shadow:
        0 7px 18px rgba(214, 51, 132, 0.25);

    transition: all 0.3s ease;
}

button:hover {
    transform: translateY(-2px);

    box-shadow:
        0 10px 22px rgba(214, 51, 132, 0.35);
}

button:active {
    transform: translateY(0);
}


/* ========================================
   SEPARADOR
======================================== */

.divider {
    display: flex;

    align-items: center;

    gap: 12px;

    margin: 25px 0;

    color: #b999a7;
}

.divider::before,
.divider::after {
    content: "";

    height: 1px;

    background: #ead6df;

    flex: 1;
}

.divider span {
    font-size: 13px;
}


/* ========================================
   REGISTRO
======================================== */

.register {
    text-align: center;

    font-size: 14px;

    color: #8a6876;
}

.register a {
    color: #c72d75;

    font-weight: bold;

    text-decoration: none;
}

.register a:hover {
    text-decoration: underline;
}


/* ========================================
   PIE DE PÁGINA
======================================== */

footer {
    text-align: center;

    margin-top: 20px;

    color: #75485b;

    font-size: 12px;
}


/* ========================================
   DISEÑO PARA CELULAR
======================================== */

@media (max-width: 500px) {

    .login-container {
        padding: 15px;
    }

    .login-card {
        padding: 30px 22px;
    }

    .logo h1 {
        font-size: 21px;
    }

    .welcome {
        font-size: 24px;
    }

    .options {
        flex-direction: column;

        align-items: flex-start;

        gap: 12px;
    }
}
/* ========================================
   PANEL DEL SISTEMA
======================================== */

.dashboard {
    max-width: 100%;
}


/* ========================================
   ENCABEZADO DEL PANEL
======================================== */

.encabezado-panel {
    display: flex;

    justify-content: space-between;

    align-items: center;

    padding-bottom: 20px;

    border-bottom: 1px solid #efdce4;
}

.encabezado-panel h1 {
    color: #a52560;

    font-size: 22px;

    line-height: 1.3;
}

.encabezado-panel h1 span {
    color: #d63384;
}

.encabezado-panel p {
    color: #8a6876;

    font-size: 13px;

    margin-top: 5px;
}


/* ========================================
   ICONO DEL USUARIO
======================================== */

.usuario-icono {
    width: 55px;
    height: 55px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 50%;

    background: linear-gradient(
        135deg,
        #d63384,
        #ee72a8
    );

    color: white;

    font-size: 25px;

    box-shadow:
        0 5px 15px rgba(214, 51, 132, 0.25);
}


/* ========================================
   BIENVENIDA
======================================== */

.bienvenida {
    text-align: center;

    margin: 25px 0;
}

.bienvenida h2 {
    margin-bottom: 8px;

    font-size: 23px;

    color: #492331;
}

.bienvenida p {
    color: #8a6876;

    font-size: 14px;

    line-height: 1.5;
}


/* ========================================
   MENÚ
======================================== */

.menu-panel {
    display: flex;

    flex-direction: column;

    gap: 12px;
}

.opcion-menu {
    display: flex;

    align-items: center;

    gap: 15px;

    padding: 15px;

    border: 1px solid #efdce4;

    border-radius: 12px;

    text-decoration: none;

    background-color: #fff;

    transition: all 0.3s ease;
}

.opcion-menu:hover {
    transform: translateX(4px);

    border-color: #d63384;

    background-color: #fff7fa;

    box-shadow:
        0 5px 15px rgba(214, 51, 132, 0.12);
}


/* ========================================
   ICONOS DEL MENÚ
======================================== */

.menu-icono {
    min-width: 48px;

    width: 48px;
    height: 48px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-radius: 10px;

    background: linear-gradient(
        135deg,
        #ffd6e7,
        #f7a9c8
    );

    font-size: 22px;
}

.opcion-menu h3 {
    color: #5c3043;

    font-size: 15px;

    margin-bottom: 4px;
}

.opcion-menu p {
    color: #8a6876;

    font-size: 12px;

    line-height: 1.4;
}


/* ========================================
   CERRAR SESIÓN
======================================== */

.cerrar-sesion {
    display: block;

    width: 100%;

    padding: 15px;

    margin-top: 25px;

    text-align: center;

    text-decoration: none;

    border-radius: 10px;

    background-color: white;

    color: #c72d75;

    border: 1px solid #e5c6d3;

    font-size: 16px;

    font-weight: bold;

    transition: 0.3s;
}

.cerrar-sesion:hover {
    background-color: #fff1f6;

    color: #a52560;
}


/* ========================================
   RESPONSIVE DEL PANEL
======================================== */

@media (max-width: 500px) {

    .encabezado-panel h1 {
        font-size: 19px;
    }

    .usuario-icono {
        width: 48px;
        height: 48px;

        font-size: 21px;
    }

    .opcion-menu {
        padding: 12px;
    }

    .menu-icono {
        min-width: 42px;

        width: 42px;
        height: 42px;

        font-size: 19px;
    }

}

    </style>
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <!-- Logo -->
            <div class="logo">

                <div class="logo-icon">
                    🏠
                </div>

                <h1>
                    Constancia
                    <span>Domiciliaria</span>
                </h1>

            </div>


            <!-- Bienvenida -->
            <p class="welcome">
                Bienvenido/a
            </p>

            <p class="subtitle">
                Ingresa tus datos para acceder al módulo de solicitud.
            </p>


            <!-- Formulario -->
            <form id="loginForm">

                <div class="input-group">

                    <label for="usuario">
                        Usuario
                    </label>

                    <input
                        type="text"
                        id="usuario"
                        name="usuario"
                        placeholder="Ingresa tu usuario"
                        required
                    >

                </div>


                <div class="input-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                </div>


                <!-- Opciones -->
                <div class="options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="recordarme"
                        >

                        Recordarme

                    </label>


                    <a href="#" id="recuperar">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>


                <!-- Botón -->
                <button type="submit">
                    Iniciar sesión
                </button>

            </form>


            <!-- Registro -->
            <div class="divider">
                <span>o</span>
            </div>

            <p class="register">

                ¿No tienes una cuenta?

                <a href="#" id="crearCuenta">
                    Crear cuenta
                </a>

            </p>

        </section>


        <!-- Pie de página -->
        <footer>
            © 2026 Melany Sarahi Hernández Bajonero
        </footer>

        </main>

    <script src="js/script.js"></script>

</body>

</html>
